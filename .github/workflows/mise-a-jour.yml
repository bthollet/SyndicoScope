# Mise à jour mensuelle des données de SyndicoScope (spécification § 9.3).
#
# Lit les fichiers publics (registre des copropriétés, annuaire des entreprises, BODACC, contours),
# calcule, contrôle, puis dépose le site en artefact Pages. Rien n'est commité.
# Le déploiement n'a lieu que si la variable de dépôt SYNDICOSCOPE_PUBLIER vaut « oui » : il est
# désactivé par défaut, et suppose que la source de GitHub Pages soit « GitHub Actions ».
# Aucun secret n'est nécessaire : PISTE n'est pas appelé ici.
# Les journaux d'Actions d'un dépôt public sont publics : build.py n'y écrit que des comptes et des
# étapes ; son journal détaillé (journal.txt, qui cite des SIRET) reste dans l'exécuteur.
# Aucune donnée brute d'API (BODACC, annuaire des entreprises, registre) ne vit dans le cache
# d'Actions ni dans un artefact (décision du 28/10/2026) : chaque passage moissonne à neuf, et le
# seul artefact est le site publié. Pas de flux de pull request : s'il en vient un, il ne lance que
# les essais unitaires, sur des jeux fictifs, sans réseau vers ces API.
name: Mise à jour des données

on:
  schedule:
    - cron: "17 4 3 * *"   # le 3 de chaque mois, 4 h 17 UTC
  workflow_dispatch:
    inputs:
      departements:
        description: "Départements séparés par des virgules (ex. 13,2A,973) ; vide : tous"
        required: false
        default: ""
      budget_appels:
        description: "Minutes d'appels à l'annuaire et au BODACC, au plus (moissonnage complet : 110 environ)"
        required: false
        default: "200"

permissions:
  contents: read

concurrency:
  group: mise-a-jour-donnees
  cancel-in-progress: false

jobs:
  construire:
    if: github.repository == 'bthollet/SyndicoScope'
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97   # v7.0.0
        with:
          python-version: "3.12"

      - name: Essais unitaires
        run: python -X utf8 -I -m unittest discover -s tests -v

      # Le manifest du mois précédent, pour le contrôle des écarts, est relu sur le site publié :
      # une donnée publiée, pas une réponse d'API. Absent (premier passage, déploiement fermé) :
      # pas de comparaison, et le contrôle le dit.
      - name: Construire et contrôler
        env:
          DEPARTEMENTS: ${{ inputs.departements }}
          BUDGET: ${{ inputs.budget_appels || '200' }}
        run: |
          if [ -n "$DEPARTEMENTS" ]; then QUI="--departements $DEPARTEMENTS"; else QUI="--tous"; fi
          PUBLIE="https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/carte/manifest.json"
          PRECEDENT=""
          mkdir -p build/precedent
          if [ -z "$DEPARTEMENTS" ] && curl -fsS --max-time 60 -o build/precedent/manifest.json "$PUBLIE"; then
            PRECEDENT="--precedent build/precedent/manifest.json"
          fi
          python -X utf8 -I pipeline/build.py $QUI --sortie build/national --budget-appels "$BUDGET" $PRECEDENT

      - name: Résumé des contrôles
        if: always()
        run: |
          if [ -f build/national/controles.json ]; then
            python -X utf8 -I -c "import json; [print(c['resultat'], '|', c['controle']) for c in json.load(open('build/national/controles.json', encoding='utf-8'))]"
          fi

      # Le site publié : la page d'accueil et la jurisprudence (docs/), les données nationales sous carte/.
      - name: Assembler le site
        run: |
          rm -rf build/pages
          mkdir -p build/pages/carte
          cp -r docs/. build/pages/
          cp -r build/national/site/. build/pages/carte/
          du -sh build/pages build/pages/carte

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9   # v5.0.0
        with:
          path: build/pages
          retention-days: 30

  deployer:
    needs: construire
    if: vars.SYNDICOSCOPE_PUBLIER == 'oui' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - id: deploiement
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346   # v5.0.1

  signaler:
    needs: construire
    if: failure() && github.repository == 'bthollet/SyndicoScope'
    runs-on: ubuntu-24.04
    permissions:
      issues: write
    steps:
      - name: Ouvrir ou compléter le ticket d'échec
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EXECUTION: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          TITRE="Mise à jour des données en échec"
          N=$(gh issue list --repo "$REPO" --state open --search "\"$TITRE\" in:title" --json number --jq '.[0].number // empty')
          if [ -n "$N" ]; then
            gh issue comment "$N" --repo "$REPO" --body "Nouvel échec : $EXECUTION"
          else
            gh issue create --repo "$REPO" --title "$TITRE" --body "L'exécution $EXECUTION s'est arrêtée : contrôle bloquant en échec, budget d'appels épuisé ou erreur. Rien n'a été publié. L'étape « Résumé des contrôles » dit lequel. Une relance à la main refait tout le moissonnage : aucun cache n'est gardé d'un passage à l'autre."
          fi
