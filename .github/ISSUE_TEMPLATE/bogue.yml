name: Bogue
description: Quelque chose ne marche pas comme prévu dans la page SyndicoScope.
title: "[Bogue] "
labels: ["bogue"]
body:
  - type: markdown
    attributes:
      value: |
        Merci de signaler ce problème.

        **Ce ticket est public.** N'y écrivez ni votre nom, ni votre adresse, ni le numéro d'immatriculation de votre copropriété, ni aucune autre donnée personnelle.
  - type: textarea
    id: probleme
    attributes:
      label: Ce qui s'est passé
      description: Ce que vous avez vu. Une capture d'écran aide beaucoup ; vérifiez qu'elle ne montre aucune donnée personnelle.
    validations:
      required: true
  - type: textarea
    id: attendu
    attributes:
      label: Ce que vous attendiez
    validations:
      required: false
  - type: textarea
    id: etapes
    attributes:
      label: Pour reproduire le problème
      description: Les étapes, dans l'ordre.
      placeholder: |
        1. Choisir la zone « Marseille 6e Arrondissement »
        2. Cliquer sur « Départs et arrivées »
        3. …
    validations:
      required: false
  - type: textarea
    id: contexte
    attributes:
      label: Contexte
      description: Rempli par la page quand vous passez par le bouton « Signaler un problème ou proposer une idée » (version, date des données, zone, filtres, navigateur). Vous pouvez le relire et le corriger.
      render: text
    validations:
      required: false
  - type: checkboxes
    id: confidentialite
    attributes:
      label: Données personnelles
      options:
        - label: Ce ticket ne contient ni nom, ni adresse, ni numéro d'immatriculation de copropriété.
          required: true
